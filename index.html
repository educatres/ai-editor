<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>AI Editor</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <main class="app">
    <header class="toolbar" aria-label="工具列">
      <div class="toolbar-actions">
        <button id="polishBtn" type="button" class="primary">潤飾</button>
        <button id="copyBtn" type="button">複製</button>
        <button id="searchBtn" type="button">Search</button>
        <button id="promptBtn" type="button">System prompt</button>
        <button id="downloadBtn" type="button">下載</button>
        <button id="zoomInBtn" type="button">放大</button>
        <button id="zoomOutBtn" type="button">縮小</button>
        <button id="settingsBtn" type="button">API</button>
        <button id="clearBtn" type="button" class="danger">清除記錄</button>
      </div>
    </header>

    <div class="editor-shell">
      <div id="lineNumbers" class="line-numbers" aria-hidden="true">1</div>
      <textarea
        id="editor"
        aria-label="文字編輯器"
        spellcheck="true"
        wrap="off"
        placeholder="在此輸入文字，並以 {{ 要潤飾的內容 }} 標記。"
      ></textarea>
    </div>
  </main>

  <dialog id="searchDialog">
    <form class="dialog-form" id="searchForm">
      <div class="dialog-head">
        <strong>搜尋</strong>
        <button type="button" class="icon-btn" data-close="searchDialog" aria-label="關閉">×</button>
      </div>

      <label>
        搜尋字串
        <input id="searchInput" type="search" autocomplete="off">
      </label>

      <div class="dialog-actions">
        <button id="searchPrevBtn" type="button">上一個</button>
        <button type="submit" class="primary">下一個</button>
      </div>
    </form>
  </dialog>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-form" id="settingsForm">
      <div class="dialog-head">
        <strong>API 設定</strong>
        <button type="button" class="icon-btn" data-close="settingsDialog" aria-label="關閉">×</button>
      </div>

      <label>
        供應商
        <select id="provider">
          <option value="cgu">CGU（現有）</option>
          <option value="openai">ChatGPT（OpenAI API）</option>
          <option value="gemini">Gemini（Google AI）</option>
          <option value="claude">Claude（Anthropic API）</option>
        </select>
      </label>

      <label>
        API Key
        <div class="key-row">
          <input id="apiKey" type="password" autocomplete="off" placeholder="輸入所選供應商的 API Key">
          <button id="toggleKeyBtn" type="button">顯示</button>
        </div>
      </label>

      <label>
        Endpoint
        <input id="endpoint" type="url" inputmode="url">
      </label>

      <label>
        模型
        <select id="model"></select>
      </label>

      <p class="hint" id="providerHint"></p>
      <p class="warning">API Key 與文章會保存在此瀏覽器的 LocalStorage。請勿在共用裝置使用。</p>

      <div class="dialog-actions">
        <button type="button" data-close="settingsDialog">取消</button>
        <button id="saveSettingsBtn" type="submit" class="primary">儲存</button>
      </div>
    </form>
  </dialog>

  <dialog id="promptDialog">
    <form method="dialog" class="dialog-form" id="promptForm">
      <div class="dialog-head">
        <strong>System prompt</strong>
        <button type="button" class="icon-btn" data-close="promptDialog" aria-label="關閉">×</button>
      </div>

      <div class="prompt-presets">
        <span>範例（追加到現有文字下方）</span>
        <div class="preset-actions">
          <button id="appendGeneralPromptBtn" type="button">通用</button>
          <button id="appendCodexPromptBtn" type="button">Codex 開發</button>
        </div>
      </div>

      <label>
        提示詞
        <textarea id="systemPrompt" rows="14"></textarea>
      </label>

      <div class="dialog-actions">
        <button type="button" data-close="promptDialog">取消</button>
        <button type="submit" class="primary">儲存</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js?v=6"></script>
</body>
</html>
